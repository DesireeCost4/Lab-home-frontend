<div class="card-status">
  <div class="card-header">
    <span class="icon-header">🖥️</span>
    <h3>STATUS DISPOSITIVOS</h3>
  </div>

  <div class="device-list">
    @for (disp of dispositivos; track disp.nome) {
      <div class="device-item">
        <div class="device-info">
          <span class="device-icon">{{ getIcon(disp.tipo) }}</span>
          <div class="device-details">
            <span class="device-name">{{ disp.nome }}</span>
            <span class="device-ip">{{ disp.detalhe }}</span>
          </div>
        </div>
        
        <span class="device-status" [ngClass]="getStatusClass(disp.status)">
          {{ disp.status }}
        </span>
      </div>
    }
  </div>
</div>
